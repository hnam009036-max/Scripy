    <script>
        // AUDIO SYNTHESIZER ENGINE (WebAudio API for zero latency on mobile)
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playEat() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playPowerup() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.2);
            }

            playGameOver() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';

                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.35);
            }

            playTurn() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.03);
            }
        }

        // GAME CONFIG & STATE MANAGEMENT
        const sound = new SoundFX();
        let vibrateEnabled = true;

        const GRID_SIZE = 20; // 20x20 Grid
        let canvas, ctx;

        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0, type: 'apple' };
        let obstacles = [];

        let powerupTimer = 0;
        let powerupInterval = null;

        let touchStartX = 0;
        let touchStartY = 0;

        // Skins Color Palette Definitions
        const SKINS = {
            cyber: {

                bodyGradient: ['#06b6d4', '#3b82f6', '#8b5cf6'],

            },

                head: '#f97316',
                bodyGradient: ['#f97316', '#ef4444', '#b91c1c'],
                glow: '#f97316'
            },
            gold: {
                head: '#facc15',
                bodyGradient: ['#facc15', '#eab308', '#ca8a04'],
                glow: '#facc15'
            },
            rainbow: {
                head: '#ec4899',
                bodyGradient: ['#ec4899', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'],
                glow: '#ec4899'
            }
        };

        // DOM ELEMENTS
        const scoreEl = document.getElementById('score-display');
        const highScoreEl = document.getElementById('high-score-display');
        const startModal = document.getElementById('start-modal');
        const gameoverModal = document.getElementById('gameover-modal');
        const pauseModal = document.getElementById('pause-modal');
        const finalScoreEl = document.getElementById('final-score');
        const finalBestEl = document.getElementById('final-best');
        const newRecordTag = document.getElementById('new-record-tag');
        const powerupBadge = document.getElementById('powerup-badge');
        const powerupTimerEl = document.getElementById('powerup-timer');
        const powerupIconEl = document.getElementById('powerup-icon');

        // TRIGGER HAPTIC VIBRATION
        function triggerHaptic(duration = 15) {
            if (vibrateEnabled && navigator.vibrate) {
                try {
                    navigator.vibrate(duration);
                } catch (e) {}
            }
        }

        // INITIALIZE CANVAS SIZE
        function setupCanvas() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');

            const wrapper = document.getElementById('canvas-wrapper');
            const rect = wrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            const displayWidth = rect.width - 8; // padding shift
            canvas.width = displayWidth * dpr;
            canvas.height = displayWidth * dpr;

            ctx.scale(dpr, dpr);
            cellSize = displayWidth / GRID_SIZE;

            if (!gameInterval && !isGameOver) {
                drawBoard();
            }
        }

        window.addEventListener('resize', setupCanvas);

        // TOUCH & KEYBOARD CONTROLS SETUP
        function changeDirection(dx, dy) {
            // Prevent reversing onto self
            if (snake.length > 1 && direction.x === -dx && direction.y === -dy) {
                return;
            }
            if (nextDirection.x !== dx || nextDirection.y !== dy) {
                sound.playTurn();
                triggerHaptic(10);
            }
            nextDirection = { x: dx, y: dy };
        }

        // Fast response control setup using pointerdown / touch events
        function bindControl(btnId, dx, dy) {
            const btn = document.getElementById(btnId);
            const handlePress = (e) => {
                e.preventDefault();
                changeDirection(dx, dy);
            };
            btn.addEventListener('pointerdown', handlePress);
            btn.addEventListener('touchstart', handlePress, { passive: false });
        }

        bindControl('btn-up', 0, -1);
        bindControl('btn-down', 0, 1);
        bindControl('btn-left', -1, 0);
        bindControl('btn-right', 1, 0);

        // Ngăn cuộn trang khi chạm vào vùng Canvas
        const canvasWrapper = document.getElementById('canvas-wrapper');
        
        canvasWrapper.addEventListener('touchmove', (e) => {
            if (!isGameOver && !isPaused) {
                e.preventDefault();
            }
        }, { passive: false });

        // Keyboard Arrow & WASD Support
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': changeDirection(0, -1); break;
                case 'ArrowDown': case 's': case 'S': changeDirection(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': changeDirection(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': changeDirection(1, 0); break;
                case 'p': case 'P': case ' ': togglePause(); break;
            }
        });

        // RENDER FUNCTIONS
        function drawBoard() {
            // Background Grid Gradient
            ctx.fillStyle = '#0b1120';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, GRID_SIZE * cellSize);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(GRID_SIZE * cellSize, i * cellSize);
                ctx.stroke();
            }

            // Draw Obstacles (Maze mode)
            if (selectedMode === 'maze') {
                ctx.fillStyle = '#475569';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#64748b';
                obstacles.forEach(obs => {
                    ctx.beginPath();
                    ctx.roundRect(obs.x * cellSize + 2, obs.y * cellSize + 2, cellSize - 4, cellSize - 4, 6);
                    ctx.fill();
                });
                ctx.shadowBlur = 0;
            }

            // Draw Food
            drawFood();

            // Draw Snake
            drawSnake();
        }

        function drawFood() {
            const x = food.x * cellSize + cellSize / 2;
            const y = food.y * cellSize + cellSize / 2;
            const radius = (cellSize / 2) - 3;

            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);

            if (food.type === 'apple') {
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 12;
            } else if (food.type === 'golden') {
                ctx.fillStyle = '#facc15';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 15;
            } else if (food.type === 'powerup') {
                ctx.fillStyle = '#a855f7';
                ctx.shadowColor = '#c084fc';
                ctx.shadowBlur = 15;
            }

            ctx.fill();
            ctx.restore();
        }

        function drawSnake() {
            const skin = SKINS[selectedSkin] || SKINS.cyber;

            snake.forEach((segment, index) => {
                const x = segment.x * cellSize + 1.5;
                const y = segment.y * cellSize + 1.5;
                const size = cellSize - 3;
                const radius = index === 0 ? 8 : 5;

                ctx.save();
                ctx.beginPath();

                if (index === 0) {
                    // Snake Head
                    ctx.fillStyle = skin.head;
                    ctx.shadowColor = skin.glow;
                    ctx.shadowBlur = 12;
                    ctx.roundRect(x, y, size, size, radius);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#ffffff';
                    let eyeX1 = x + 4, eyeY1 = y + 4, eyeX2 = x + size - 6, eyeY2 = y + 4;
                    if (direction.x === 1) { eyeX1 = x + size - 6; eyeY1 = y + 4; eyeX2 = x + size - 6; eyeY2 = y + size - 6; }
                    else if (direction.x === -1) { eyeX1 = x + 4; eyeY1 = y + 4; eyeX2 = x + 4; eyeY2 = y + size - 6; }
                    else if (direction.y === 1) { eyeX1 = x + 4; eyeY1 = y + size - 6; eyeX2 = x + size - 6; eyeY2 = y + size - 6; }

                    ctx.fillRect(eyeX1, eyeY1, 3, 3);
                    ctx.fillRect(eyeX2, eyeY2, 3, 3);
                } else {
                    // Snake Body Gradient Segment
                    const colorIndex = (index - 1) % skin.bodyGradient.length;
                    ctx.fillStyle = skin.bodyGradient[colorIndex];
                    ctx.shadowBlur = 0;
                    ctx.roundRect(x, y, size, size, radius);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        // GAME LOGIC TICK & UPDATES
        function gameTick() {
            if (isPaused || isGameOver) return;

            direction = nextDirection;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Portal Mode (Wrap Borders)
            if (selectedMode === 'portal') {
                if (head.x < 0) head.x = GRID_SIZE - 1;
                if (head.x >= GRID_SIZE) head.x = 0;
                if (head.y < 0) head.y = GRID_SIZE - 1;
                if (head.y >= GRID_SIZE) head.y = 0;
            } else {
                // Wall Collision Check
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    gameOver('Bạn đã va phải tường!');
                    return;
                }
            }

            // Self Collision Check
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver('Rắn tự cắn phải đuôi của mình!');
                    return;
                }
            }

            // Obstacle Collision Check (Maze Mode)
            if (selectedMode === 'maze') {
                for (let obs of obstacles) {
                    if (obs.x === head.x && obs.y === head.y) {
                        gameOver('Bạn đã va vào chướng ngại vật!');
                        return;
                    }
                }
            }

            // Move Snake Forward
            snake.unshift(head);

            // Food Collision Check
            if (head.x === food.x && head.y === food.y) {
                eatFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }

            drawBoard();
        }

        function eatFood() {
            let points = 10;
            if (food.type === 'golden') points = 30;
            if (activePowerup === 'double') points *= 2;

            score += points;
            scoreEl.textContent = score;

            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = highScore;
                localStorage.setItem('snake_highscore', highScore.toString());
            }

            if (food.type === 'powerup') {
                sound.playPowerup();
                triggerHaptic(40);
                activateRandomPowerup();
            } else {
                sound.playEat();
                triggerHaptic(20);
            }

            // Spawn floating score combo popup
            showComboText(`+${points}`);

            spawnFood();
        }

        function activateRandomPowerup() {
            const types = ['double', 'slow'];
            activePowerup = types[Math.floor(Math.random() * types.length)];
            powerupTimer = 6;

            powerupBadge.classList.remove('hidden');
            if (activePowerup === 'double') {
                powerupIconEl.textContent = '2️⃣';
                powerupTimerEl.textContent = 'X2 Điểm (6s)';
            } else {
                powerupIconEl.textContent = '⏳';
                powerupTimerEl.textContent = 'Chậm Lại (6s)';
                updateTickSpeed(320); // Tốc độ cực chậm khi nhận powerup slow
            }

            clearInterval(powerupInterval);
            powerupInterval = setInterval(() => {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    deactivatePowerup();
                } else {
                    powerupTimerEl.textContent = `${activePowerup === 'double' ? 'X2 Điểm' : 'Chậm Lại'} (${powerupTimer}s)`;
                }
            }, 1000);
        }

        function deactivatePowerup() {
            clearInterval(powerupInterval);
            activePowerup = null;
            powerupBadge.classList.add('hidden');
            updateTickSpeed(getSpeedForMode(selectedMode));
        }

        function showComboText(text) {
            const popup = document.getElementById('combo-popup');
            const popupText = document.getElementById('combo-text');
            popupText.textContent = text;
            popup.classList.remove('opacity-0');
            popupText.classList.remove('scale-125');

            setTimeout(() => {
                popup.classList.add('opacity-0');
                popupText.classList.add('scale-125');
            }, 400);
        }

        function spawnFood() {
            let valid = false;
            let fx, fy;

            while (!valid) {
                fx = Math.floor(Math.random() * GRID_SIZE);
                fy = Math.floor(Math.random() * GRID_SIZE);

                valid = !snake.some(s => s.x === fx && s.y === fy) &&
                        !obstacles.some(o => o.x === fx && o.y === fy);
            }

            // Randomize Food Type
            const rand = Math.random();
            let type = 'apple';
            if (rand > 0.85) type = 'golden';
            else if (rand > 0.7) type = 'powerup';

            food = { x: fx, y: fy, type: type };
        }

        function setupMazeObstacles() {
            obstacles = [];
            if (selectedMode !== 'maze') return;

            // Simple inner maze blocks layout
            const center = Math.floor(GRID_SIZE / 2);
            for (let i = -3; i <= 3; i++) {
                if (i !== 0) {
                    obstacles.push({ x: center + i, y: center - 4 });
                    obstacles.push({ x: center + i, y: center + 4 });
                }
            }
        }

        function getSpeedForMode(mode) {
            if (mode === 'speed') return 140;
            return 220; // Tốc độ tiêu chuẩn nhịp nhàng, chậm vừa phải để bấm nút
        }

        function updateTickSpeed(newSpeed) {
            gameSpeed = newSpeed;
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            // Always set interval so snake moves continuously
            gameInterval = setInterval(gameTick, gameSpeed);
        }

        // GAME STATE CONTROL (START, RESTART, PAUSE, GAMEOVER)
        function startGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            isGameOver = false;
            isPaused = false;

            scoreEl.textContent = score;
            highScoreEl.textContent = highScore;

            deactivatePowerup();
            setupMazeObstacles();
            spawnFood();
            setupCanvas();

            startModal.classList.add('hidden');
            gameoverModal.classList.add('hidden');
            pauseModal.classList.add('hidden');

            updateTickSpeed(getSpeedForMode(selectedMode));
        }

        function gameOver(reason) {
            isGameOver = true;
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }

            sound.playGameOver();
            triggerHaptic([100, 50, 100]);

            finalScoreEl.textContent = score;
            finalBestEl.textContent = highScore;
            document.getElementById('gameover-reason').textContent = reason;

            if (score >= highScore && score > 0) {
                newRecordTag.classList.remove('hidden');
            } else {
                newRecordTag.classList.add('hidden');
            }

            gameoverModal.classList.remove('hidden');
        }

        function togglePause() {
            if (isGameOver || startModal.classList.contains('hidden') === false) return;

            isPaused = !isPaused;
            if (isPaused) {
                pauseModal.classList.remove('hidden');
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
            } else {
                pauseModal.classList.add('hidden');
                updateTickSpeed(getSpeedForMode(selectedMode));
            }
        }

        // EVENT BINDINGS FOR MODALS & BUTTONS
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        document.getElementById('pause-restart-btn').addEventListener('click', startGame);
        document.getElementById('pause-btn').addEventListener('click', togglePause);
        document.getElementById('resume-btn').addEventListener('click', togglePause);

        document.getElementById('menu-btn').addEventListener('click', () => {
            gameoverModal.classList.add('hidden');
            startModal.classList.remove('hidden');
        });

        document.getElementById('pause-menu-btn').addEventListener('click', () => {
            pauseModal.classList.add('hidden');
            startModal.classList.remove('hidden');
        });

        // Mode Selection Handlers
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.remove('active', 'border-cyan-500', 'bg-cyan-500/20', 'text-cyan-300');
                    b.classList.add('border-slate-700', 'bg-slate-800/50', 'text-slate-400');
                });
                const target = e.currentTarget;
                target.classList.add('active', 'border-cyan-500', 'bg-cyan-500/20', 'text-cyan-300');
                target.classList.remove('border-slate-700', 'bg-slate-800/50', 'text-slate-400');
                selectedMode = target.dataset.mode;
            });
        });

        // Skin Selection Handlers
        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.skin-btn').forEach(b => {
                    b.classList.remove('active', 'border-cyan-400');
                    b.classList.add('border-slate-700');
                });
                const target = e.currentTarget;
                target.classList.add('active', 'border-cyan-400');
                target.classList.remove('border-slate-700');
                selectedSkin = target.dataset.skin;
            });
        });

        // Toggle Audio
        document.getElementById('toggle-sound').addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            document.getElementById('sound-status').textContent = sound.enabled ? 'BẬT' : 'TẮT';
            document.getElementById('sound-icon').textContent = sound.enabled ? '🔊' : '🔇';
        });

        // Toggle Vibration
        document.getElementById('toggle-vibe').addEventListener('click', () => {
            vibrateEnabled = !vibrateEnabled;
            document.getElementById('vibe-status').textContent = vibrateEnabled ? 'BẬT' : 'TẮT';
            document.getElementById('vibe-icon').textContent = vibrateEnabled ? '📳' : '🔕';
            if (vibrateEnabled) triggerHaptic(30);
        });

        // INITIAL ONLOAD SETUP
        window.onload = function() {
            highScoreEl.textContent = highScore;
            setupCanvas();
        };
    </script>
</body>
</html>
